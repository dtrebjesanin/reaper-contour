name: deploy

# Regenerates index.xml from the in-script ReaPack metadata headers (Contour/contour.lua) and commits it
# back to the repo. The index.xml is what users import into ReaPack. Release workflow is just: bump
# @version + @changelog in Contour/contour.lua, commit, push — this Action does the rest.
#
# Requires: Settings > Actions > General > Workflow permissions = "Read and write permissions"
# (or the permissions block below) so the bot can push index.xml.
#
# Hardening (2026-10-29) — this job holds a write token, and whatever lands on master reaches every
# ReaPack user:
#   * Gems install FROZEN from .github/reapack/Gemfile.lock (exact versions + checksums), so a new or
#     tampered release of any dependency can't run here. Update it deliberately (see the Gemfile).
#   * Actions are pinned to full commit SHAs (a moved tag can't swap the code); the comment names the release.
#   * The token never sits on disk (persist-credentials: false) while gem code builds and runs; only the
#     final push step gets it, via its env, with git hooks disabled.

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  reapack-index:
    # Pinned, not ubuntu-latest: on Ubuntu 26 (ubuntu-latest from 2026-10-19) `gem install reapack-index`
    # fails building rugged — the image's OpenSSL 3.5 adds -l:libjitterentropy.a to the link line and the
    # static library isn't on the runner. Verified 2026-10-29: rugged 1.9.4 and 1.9.6 both install on 24.04.
    runs-on: ubuntu-24.04
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/.github/reapack/Gemfile
      BUNDLE_FROZEN: 'true'
    steps:
    - name: Fetch repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0   # reapack-index walks full history to build the version list
        persist-credentials: false
    - name: Configure git
      run: |-
        git config user.name  'Contour Bot'
        git config user.email 'contour-bot@users.noreply.github.com'
    - name: Install Pandoc
      run:  sudo apt-get update && sudo apt-get install -yy pandoc
    - name: Set up Ruby
      uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
      with:
        ruby-version: '3.4'
    - name: Install reapack-index (locked versions)
      run:  bundle install
    - name: Update index.xml
      run:  bundle exec reapack-index --commit --name 'Contour'
    - name: Push changes
      env:
        GH_TOKEN: ${{ github.token }}
      run:  git -c core.hooksPath=/dev/null push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:master
